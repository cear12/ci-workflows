# Reusable secret scan (full history). Free for personal accounts, no license needed.
#   uses: cear12/ci-workflows/.github/workflows/gitleaks.yml@v1
name: gitleaks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
