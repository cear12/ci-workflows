# Reusable Flutter CI: analyze + test + debug Android build.
#   uses: cear12/ci-workflows/.github/workflows/flutter.yml@v1
name: flutter

on:
  workflow_call:
    inputs:
      flutter-version-file:
        description: File that pins the SDK (.fvmrc or pubspec.yaml with an exact version)
        type: string
        default: .fvmrc
      working-directory:
        type: string
        default: "."
      java-version:
        type: string
        default: "17"
      build-android:
        description: Also run `flutter build apk --debug`
        type: boolean
        default: true
      check-format:
        type: boolean
        default: false
      check-codegen:
        description: Re-run build_runner and fail if generated files are stale
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: ${{ inputs.working-directory }}/${{ inputs.flutter-version-file }}
          cache: true

      - run: flutter --version
      - run: flutter pub get

      - name: Check generated code is up to date
        if: inputs.check-codegen
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- '*.g.dart'

      - name: Format
        if: inputs.check-format
        run: dart format --output=none --set-exit-if-changed lib test

      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      - name: Build debug APK
        if: inputs.build-android
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v7
        if: inputs.build-android
        with:
          name: app-debug-apk
          path: ${{ inputs.working-directory }}/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
